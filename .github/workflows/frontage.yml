name: Frontage daily

# live = the real day (search when needed, pipeline, sender to businesses)
# test = sender only, one email per mailbox to TEST_EMAIL; nothing on Drive changes except the log
# upgrade-sender = one-off: makes "Frontage Sender v2.3 LIVE" on Drive from v2.2 (tools/upgrade_sender.py)
# replies = only the reply and bounce stopper (reads the mailboxes, updates do-not-contact)
# check-mailboxes = one-off, read-only: can the runner read the 5 mailboxes (counts only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        type: choice
        options: [test, live, replies, upgrade-sender, check-mailboxes]
        default: test
  schedule:                     # UTC = Irish time in winter, Irish time minus 1 hour in summer
    - cron: "17 6 * * *"        # every day: search and pipeline when stock is low; sender on weekdays
    - cron: "47 9 * * 1-5"      # weekday back-up start (GitHub timers can run hours late)
    - cron: "47 12 * * 1-5"     # second back-up; a later start finds today already sent and sends 0

permissions:
  contents: read

concurrency:
  group: frontage
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
      DRIVE_DIR: /content/drive/MyDrive/Frontage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -q -r requirements.txt
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null

      - name: Connect Google Drive
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\nskip_gdocs = true\ntoken = %s\n' "$RCLONE_DRIVE_TOKEN" > ~/.config/rclone/rclone.conf
          sudo mkdir -p /content && sudo chown "$USER" /content

      - name: Download from Drive
        id: download
        run: |
          rclone copy "gdrive:Frontage" "$DRIVE_DIR" \
            --filter "+ /towns/**" --filter "+ /latest/4A_reports.zip" --filter "+ /latest/*.csv" \
            --filter "+ /*" --filter "- **" --quiet
          mkdir -p /content/notebooks
          for nb in $(jq -r '.notebooks[] | @base64' config/frontage.json); do
            name=$(echo "$nb" | base64 -d)
            rclone copyto "gdrive:Colab Notebooks/$name" "/content/notebooks/$name" --quiet || echo "not on Drive yet: $name"
          done
          echo "downloaded: $(find "$DRIVE_DIR" -type f | wc -l) files, $(ls /content/notebooks | wc -l) notebooks"

      - name: Make Sender v2.3 on Drive (one-off)
        if: env.MODE == 'upgrade-sender'
        run: |
          if rclone lsf "gdrive:Colab Notebooks/" | grep -qx "Frontage Sender v2.3 LIVE.ipynb"; then
            echo "Sender v2.3 is already on Drive; nothing done."; exit 0
          fi
          rclone copyto "gdrive:Colab Notebooks/Frontage Sender v2.2 LIVE.ipynb" /content/v22.ipynb
          python tools/upgrade_sender.py /content/v22.ipynb "/content/Frontage Sender v2.3 LIVE.ipynb"
          rclone copyto "/content/Frontage Sender v2.3 LIVE.ipynb" "gdrive:Colab Notebooks/Frontage Sender v2.3 LIVE.ipynb"
          echo "saved: Colab Notebooks/Frontage Sender v2.3 LIVE.ipynb (v2.2 kept as it was)"

      - name: Check the mailboxes (read-only)
        if: env.MODE == 'check-mailboxes'
        env:
          SMTP_PASSWORD_1: ${{ secrets.SMTP_PASSWORD_1 }}
          SMTP_PASSWORD_2: ${{ secrets.SMTP_PASSWORD_2 }}
          SMTP_PASSWORD_3: ${{ secrets.SMTP_PASSWORD_3 }}
          SMTP_PASSWORD_4: ${{ secrets.SMTP_PASSWORD_4 }}
          SMTP_PASSWORD_5: ${{ secrets.SMTP_PASSWORD_5 }}
        run: python tools/check_mailboxes.py

      - name: Run the day
        if: env.MODE == 'live' || env.MODE == 'test' || env.MODE == 'replies'
        env:
          SMTP_PASSWORD_1: ${{ secrets.SMTP_PASSWORD_1 }}
          SMTP_PASSWORD_2: ${{ secrets.SMTP_PASSWORD_2 }}
          SMTP_PASSWORD_3: ${{ secrets.SMTP_PASSWORD_3 }}
          SMTP_PASSWORD_4: ${{ secrets.SMTP_PASSWORD_4 }}
          SMTP_PASSWORD_5: ${{ secrets.SMTP_PASSWORD_5 }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        run: python runner/daily.py run --mode "$MODE"

      - name: Never keep a half-finished pipeline
        if: always()
        run: python runner/daily.py finalize

      - name: Save to Drive
        if: always() && steps.download.outcome == 'success' && (env.MODE == 'live' || env.MODE == 'test' || env.MODE == 'replies')
        run: |
          if [ "$MODE" = "live" ] || [ "$MODE" = "replies" ]; then
            rclone copy "$DRIVE_DIR" "gdrive:Frontage" --checksum --quiet
          else
            rclone copy "$DRIVE_DIR/runs" "gdrive:Frontage/runs" --checksum --quiet
          fi
          echo "saved to Drive (mode: $MODE)"
